[profile.default]
evm_version = "osaka"
solc = "0.8.36"
optimizer = true
via_ir = true
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@openzeppelin/foundry-upgrades/=lib/openzeppelin-foundry-upgrades/src/",
]

ignored_warnings_from = [
    "lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/utils", # Warning 6335: "error" will be promoted to keyword in the future and will not be allowed as an identifier anymore.
    "lib/openzeppelin-foundry-upgrades",                                                 # Warning 2018: Function state mutability can be restricted to pure
]

optimizer_runs = 10_000
fuzz = { runs = 1_000 }

out = "out"
src = "src"
libs = ["lib"]
test = "test"
script = "script"

gas_reports = ["XanV1", "XanV2", "XanGovernor"]

allow_internal_expect_revert = true

[lint]
exclude_lints = [
    "inline-assembly",             # Solhint and Slither check this instead.
    "internal-function-used-once", # Counts the call sites of `src` alone, because `ignore` hides those of the tests.
    "missing-events-arithmetic",   # Slither checks this instead (`events-maths`).
    "mixed-case-function",         # Reports `CLOCK_MODE`, whose name EIP-6372 fixes; Solhint checks the names instead.
    "reentrancy-events",           # Reports events that no external call precedes; Slither checks this instead.
    "require-revert-in-loop",      # The loops revert on purpose: one invalid recipient must abort the whole batch.
]
ignore = ["test/**/*.sol"] # Relaxed the way `.solhint.other.json` relaxes them.

[invariant]
runs = 500
depth = 64
fail_on_revert = false

[profile.ci]
fuzz = { runs = 10_000 }
verbosity = 3


[rpc_endpoints]
mainnet = "https://eth-mainnet.g.alchemy.com/v2/${ALCHEMY_API_KEY}"
sepolia = "https://eth-sepolia.g.alchemy.com/v2/${ALCHEMY_API_KEY}"

# Full reference https://github.com/foundry-rs/foundry/tree/master/crates/config
